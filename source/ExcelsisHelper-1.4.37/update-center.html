<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Excelsis Update Center</title>
  <link rel="stylesheet" href="./update-center.css">
</head>
<body>
  <main>
    <header><h1>Update Center</h1><button id="refresh" type="button">Refresh</button></header>
    <section id="products" aria-label="Available software updates" aria-live="polite">
      <article class="product" data-product="viewer">
        <div class="product-info"><h2>ExcelsisView</h2><p class="version">Checking...</p><p class="detail"></p><progress max="100" value="0" aria-label="Viewer update progress"></progress></div>
        <button class="install" type="button" disabled>Checking...</button>
      </article>
      <article class="product" data-product="helper">
        <div class="product-info"><h2>Excelsis Helper</h2><p class="version">Checking...</p><p class="detail"></p><progress max="100" value="0" aria-label="Helper update progress"></progress></div>
        <button class="install" type="button" disabled>Checking...</button>
      </article>
      <article class="product" data-product="macros">
        <div class="product-info"><h2>Helper macros</h2><p class="version">Checking...</p><p class="detail"></p><progress max="100" value="0" aria-label="Macro update progress"></progress></div>
        <button class="install" type="button" disabled>Checking...</button>
      </article>
    </section>
    <p class="notice">Unsigned installers may trigger Windows UAC or SmartScreen. Macro updates keep verified backups and never replace your settings or worklogs.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="./update-center.js"></script>
</body>
</html>
